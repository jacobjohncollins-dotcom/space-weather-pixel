name: Refresh NOAA data snapshot

# NOAA's services.swpc.noaa.gov started returning an AWS WAF JS challenge to
# cross-origin browser fetch() calls instead of real feed data, which broke
# every live reading on the deployed site (see scripts/fetch-noaa-snapshot.mjs
# for the full explanation). This workflow re-fetches each feed server-side
# on a schedule and rebuilds+redeploys the site with a fresh same-origin
# snapshot baked in, since a plain server-side request isn't challenged the
# same way.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-sprites.mjs
      - run: node scripts/fetch-noaa-snapshot.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
